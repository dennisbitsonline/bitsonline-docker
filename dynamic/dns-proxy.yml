tcp:
  routers:
    dns-tcp-proxy:
      rule: HostSNI(`*`)
      service: svc-dns-tcp-proxy
      entryPoints:
        - dns-tcp-proxy
      tls:
        passthrough: true
  services:
    svc-dns-tcp-proxy:
      loadBalancer:
        servers:
          - address: dns-server:538
udp:
  routers:
    dns-udp-proxy:
      entryPoints:
        - dns-udp-proxy
      service: svc-dns-udp-proxy
  services:
    svc-dns-udp-proxy:
      loadBalancer:
        servers:
          - address: dns-server:538
