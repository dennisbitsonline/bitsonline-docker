http:
  routers:
    gk-id:
      entryPoints:
        - websecure
      rule: "Host(`id.auth.bitsonline.nl`) || Host(`id.lan.bitsonline.nl`)"
      service: svc-gk-id
      tls: {}
    gk-admin:
      entryPoints:
        - websecure
      rule: "Host(`admin.auth.bitsonline.nl`)"
      service: svc-gk-admin
      tls: {}
  services:
    svc-gk-id:
      loadBalancer:
        servers:
          - url: http://gatekeeper:8282
    svc-gk-admin:
      loadBalancer:
        servers:
          - url: http://gatekeeper:8283
  middlewares:
    gk-access:
      forwardAuth:
        trustForwardHeader: true
        address: "http://gatekeeper:8282/auth/verify"
        maxResponseBodySize: "1048576"
        authResponseHeaders:
          - X-Auth-User
          - X-Auth-Email
          - X-Auth-Groups
