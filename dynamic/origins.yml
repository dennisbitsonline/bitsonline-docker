http:
  middlewares:
    origins:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowOriginList:
          - https://proxy.lan.bitsline.nl
          - https://proxy.bitsline.nl
          - https://proxy.remote.bitsline.nl
          - https://proxy.8it5.nl
          - https://proxy.remote.8it5.nl
          - https://proxy.indehoven.com
        accessControlMaxAge: 30
        addVaryHeader: true
    origin:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
          - HEAD
        accessControlAllowHeaders:
          - '*'
        accessControlAllowOriginList:
          - '*'
        accessControlMaxAge: 100
        addVaryHeader: true
