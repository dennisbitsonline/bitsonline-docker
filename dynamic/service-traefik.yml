http:
  routers:
    traefik:
      rule: (Host(`localhost`) || Host(`traefik.lan.bitsonline.nl`)) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      service: api@internal
      tls: {}       # Enables TLS
 #           middlewares:
 #               - aut

        # Expose a ping endpoint, for healthcheck services to check traefik is still up.
    ping:
      rule: "(Host(`localhost`) || Host(`traefik.lan.bitsonline.nl`)) && PathPrefix(`/ping`)"
      service: "ping@internal"
      tls: {}
      entryPoints:
        - ping
tcp:
  routers:
    technitium-tls-pass:
      rule: HostSNI(`*`)
      service: technitium-tls-pass-service
      entryPoints:
        - dns-tcp-proxy
      tls:
        passthrough: true
  services:
    technitium-tls-pass-service:
      loadBalancer:
        servers:
          - address: 192.168.2.1:53443
