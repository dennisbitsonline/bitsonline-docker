http:
  middlewares:
    # rate limiting
    rate-limit:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
        # uncomment the next lines if behind cloudflare
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipAllowList:
        sourceRange:
          - "10.0.0.0/8"
          - "192.168.0.0/16"
          - "172.16.0.0/12"
          - "100.64.0.0/10"

    secure-chain:
      chain:
        middlewares:
          - rate-limit
          - default-whitelist
          - crowdsec
          - gk-access
          - security-headers
    service-chain:
      chain:
        middlewares:
          - rate-limit
          - default-whitelist


    # Only allow local networks
    secure-headers:
      headers:
        customResponseHeaders:
          Server: ''
          X-Powered-By: ''
          X-Forwarded-Proto: https
        sslProxyHeaders:
          X-Forwarded-Proto: https
        hostsProxyHeaders:
          - X-Forwarded-Host
        customRequestHeaders:
          X-Forwarded-Proto: https
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        browserXssFilter: false
        referrerPolicy: strict-origin-when-cross-origin
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 63072000
        stsPreload: true
