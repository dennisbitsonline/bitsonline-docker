http:
  routers:
    webapps:
      rule: Host(`webapps.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-webapps
      middlewares:
        - secure-chain@file
      tls: {}
  services:
    svc-webapps:
      loadBalancer:
        servers:
          - url: http://localhost:8280
