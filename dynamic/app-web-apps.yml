http:
  routers:
    webapps:
      rule: Host(`webapps.lan.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-webapps
      middlewares:
        - origins@file
        - security-headers@file
        - pangolin-badger@file
        - crowdsec@file
        - gk-access@file
      tls:
        certResolver: cloudflare
        options: tls-opts
  services:
    svc-webapps:
      loadBalancer:
        servers:
          - url: http://localhost
