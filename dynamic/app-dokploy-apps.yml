http:
  routers:
    dokploy:
      rule: Host(`dokploy.lan.bitsonline.nl`) || Host(`dokploy.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-dokploy
      middlewares:
        - secure-chain@file
      tls:
        certResolver: cloudflare
        options: tls-opts
    openclaw:
      rule: Host(`openclaw.lan.bitsonline.nl`) || Host(`openclaw.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-openclaw
      middlewares:
        - secure-chain@file
      tls:
        certResolver: cloudflare
        options: tls-opts
  services:
    svc-dokploy:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:3000
    svc-openclaw:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:8080
