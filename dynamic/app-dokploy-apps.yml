http:
  routers:
    dokploy:
      rule: Host(`dokploy.lan.bitsonline.nl`) || Host(`dokploy.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-dokploy
      middlewares:
        - secure-chain@file
      tls:
        certResolver: cloudflare
        options: tls-opts
    dokploy-traefik:
      rule: Host(`dokploy-traefik.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-openclaw
      middlewares:
        - secure-chain@file
      tls:
        certResolver: cloudflare
        options: tls-opts
    openclaw:
      rule: Host(`openclaw.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: openclaw-service
      middlewares:
        - secure-chain@file
      tls:
        certResolver: cloudflare
  services:
    svc-dokploy:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:3000
    svc-openclaw:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:8080
    openclaw-service:
      loadBalancer:
        servers:
          - url: http://my-first-project-openclaw-ab997d-207-180-228-187.sslip.io:80
        passHostHeader: false
        serversTransport: openclaw-transport
  serversTransports:
    openclaw-transport:
      insecureSkipVerify: true
