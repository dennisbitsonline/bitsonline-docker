http:
  routers:
    host:
      rule: Host(`host.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-host
      middlewares:
        - secure-chain@file
      tls: {}
    dokploy:
      rule: Host(`dokploy.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-dokploy
      middlewares:
        - secure-chain@file
      tls: {}
    dokploy-traefik:
      rule: Host(`dokploy-traefik.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-dokploy-traefik
      middlewares:
        - secure-chain@file
      tls: {}
    openclaw:
      rule: Host(`openclaw.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: svc-openclaw
      tls: {}
  services:
    svc-dokploy:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:3000
    svc-dokploy-traefik:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:8080
    svc-openclaw:
      loadBalancer:
        servers:
          - url: http://my-first-project-openclaw-ab997d-207-180-228-187.sslip.io:80
        serversTransport: openclaw-transport
        passHostHeader: false
    svc-host:
      loadBalancer:
        servers:
          - url: https://new.contabo.com
        serversTransport: openclaw-transport
        passHostHeader: false

  serversTransports:
    openclaw-transport:
      insecureSkipVerify: true


