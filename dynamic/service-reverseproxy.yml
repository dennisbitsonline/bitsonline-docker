http:
  routers:
# gRPC router (needs h2c backend for HTTP/2 cleartext)
    proxy-grpc:
      rule: Host(`proxy.bitsonline.nl`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      entrypoints: websecure
      tls:
        certresolver: letsencrypt
      service: svc-proxy-h2c
      priority: 100

# Backend router (relay, WebSocket, API, OAuth2)
    proxy-backend:
      rule: Host(`proxy.bitsonline.nl`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      entrypoints: websecure
      tls: {}
      service: svc-proxy-backend
      priority: 100

      entryPoints:
        - websecure
      middlewares:
        - service-chain@file
  services:
    svc-proxy-backend:
      loadBalancer:
        servers:
          - url: http://traefik:80
    svc-proxy-h2c:
      loadbalancer:
        servers:
          - port: 80
          - scheme: h2c
