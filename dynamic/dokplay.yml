http:
  routers:
    dokploy:
      rule: Host(`dokploy.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: dokploy-service
      middlewares:
        - secure-chain@file
      tls:
        certResolver: cloudflare
    dashboard:
      rule: Host(`dashboard.remote.bitsonline.nl`)
      entryPoints:
        - websecure
      service: dashboard-service
      middlewares:
        - secure-chain@file
      tls:
        certResolver: cloudflare
  services:
    dokploy-service:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:3000
    dashboard-service:
      loadBalancer:
        servers:
          - url: http://207.180.228.187:8080
