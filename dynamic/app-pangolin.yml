http:
  routers:
    pangolin-idh:
      entryPoints:
        - websecure
      rule: "Host(`pangolin.lan.bitsonline.nl`)"
      service: svc-pangolin-idh
      tls: {}
  services:
    svc-pangolin-idh:
      loadBalancer:
        servers:
          - url: http://pangolin-idh:2110
      middlewares:
        - pangolin-badger@file

  middlewares:
    pangolin-badger:
      plugin:
        badger:
          apiBaseUrl: https://app.pangolin.net/api/v1/auth/newt/get-token
          resourceSessionRequestParam: p_session_request
          userSessionCookieName: p_session_token

