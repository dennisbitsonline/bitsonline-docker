http:
  routers:
    openwrt:
      entryPoints:
        - "websecure"
      rule: "Host(`openwrt.lan.bitsonline.nl`)"
      service: svc-openwrt
      tls: {}
    gateway:
      entryPoints:
        - "websecure"
      rule: "Host(`gateway.lan.bitsonline.nl`)"
      service: svc-gateway
      tls: {}
    wifi-ap:
      entryPoints:
        - "websecure"
      rule: "Host(`wifi-ap.lan.bitsonline.nl`)"
      service: svc-wifi
      tls: {}
    hue:
      entryPoints:
        - "websecure"
      rule: "Host(`hue.lan.bitsonline.nl`)"
      service: svc-hue
      tls: {}
    avr:
      entryPoints:
        - "websecure"
      rule: "Host(`avr.lan.bitsonline.nl`)"
      service: svc-avr
      tls: {}
    win-rdp:
      entryPoints:
        - websecure
      rule: "Host(`win-rdp.lan.bitsonline.nl`)"
      service: svc-win-rdp
      tls: {}
    win-ssh:
      entryPoints:
        - "websecure"
      rule: "Host(`win-ssh.lan.bitsonline.nl`)"
      service: svc-win-ssh
      tls: {}

  services:
    svc-openwrt:
      loadBalancer:
        servers:
          - url: "http://192.168.2.253:80"
    svc-gateway:
      loadBalancer:
        servers:
          - url: "http://192.168.2.254:80"
    svc-wifi:
      loadBalancer:
        servers:
          - url: "http://192.168.2.14:80"
          - url: "http://192.168.2.20:80"
    svc-hue:
      loadBalancer:
        servers:
          - url: "http://192.168.2.15:80"
    svc-avr:
      loadBalancer:
        servers:
          - url: "http://192.168.2.16:80"
          - url: "https://192.168.2.16:443"
          - url: "http://192.168.2.16:8080"
    svc-win-rdp:
      loadBalancer:
        servers:
          - url: h2c://192.168.2.22:3389
    svc-win-ssh:
      loadBalancer:
        servers:
          - url: "ssh://192.168.2.22:22"
