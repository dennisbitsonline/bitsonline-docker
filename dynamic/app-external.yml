http:
  routers:
    openwrt:
      entryPoints:
        - "websecure"
      rule: "Host(`openwrt.lan.bitsonline.nl`)"
      service: svc-openwrt
      tls: {}
    gateway:
      entryPoints:
        - "websecure"
      rule: "Host(`gateway.lan.bitsonline.nl`)"
      service: svc-gateway
      tls: {}
    wifi-ap:
      entryPoints:
        - "websecure"
      rule: "Host(`wifi-ap.lan.bitsonline.nl`)"
      service: svc-wifi
      tls: {}
    hue:
      entryPoints:
        - "websecure"
      rule: "Host(`hue.lan.bitsonline.nl`)"
      service: svc-hue
      tls: {}

  services:
    svc-openwrt:
      loadBalancer:
        servers:
          - url: "http://192.168.2.253:80"
    svc-gateway:
      loadBalancer:
        servers:
          - url: "http://192.168.2.254:80"
    svc-wifi:
      loadBalancer:
        servers:
          - url: "http://192.168.2.14:80"
          - url: "http://192.168.2.20:80"
    svc-hue:
      loadBalancer:
        servers:
          - url: "http://192.168.2.15:80"
